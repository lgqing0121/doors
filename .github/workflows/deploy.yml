name: Build and deploy DOORS Field Guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://doors-field-guide.pages.dev' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: doors-field-guide
          path: dist/

  deploy:
    needs: build
    if: ${{ vars.CLOUDFLARE_CONFIGURED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://doors-field-guide.pages.dev' }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=doors-field-guide --branch=main
